<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Cloud Test</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      color: #1f2937;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f3f4f6;
    }

    main {
      width: min(100%, 48rem);
      padding: 3rem 2rem;
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 1rem 2.5rem rgba(31, 41, 55, 0.12);
    }

    h1 {
      margin: 0;
      color: #111827;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 1.1;
    }

    p {
      margin: 1.5rem 0 0;
      color: #4b5563;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Codex Cloud Test</h1>
    <p>GitHub repository successfully edited by Codex Cloud.</p>
  </main>
</body>
</html>
