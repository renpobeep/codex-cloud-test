<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High Score Viewer</title>
  <style>
     @font-face {
    font-family: "Rye";
    src: url("assets/fonts/Rye-Regular.ttf") format("truetype");
    font-style: normal;
    font-weight: 400;
}
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #050505;
    }
    .viewer {
      position: relative;
      width: min(100vw, 177.7778vh);
      height: min(100vh, 56.25vw);
      overflow: hidden;
        background: url("assets/high-score-viewer-bg-6digit.png") center / 100% 100% no-repeat;
}
    
  .score {
    position: absolute;
    z-index: 2;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: 100%;
    place-items: center;
    place-content: center;
    container-type: size;
    color: #003ee8;
    font-family: "Rye", serif;
    font-size: clamp(38px, 11.2vmin, 176px);
    font-weight: 400;
    font-stretch: normal;
    font-variant-numeric: lining-nums tabular-nums;
    line-height: .85;
    white-space: nowrap;
    transform: scaleX(1.03);
    -webkit-text-stroke: .18vmin #111;
    text-shadow: .08vmin .10vmin #fff, .18vmin .20vmin #191919;
}
    .score .digit {
      display: grid;
      grid-row: 1;
      place-items: center;
      min-width: 0;
      height: 100%;
      text-align: center;
      transform: scaleX(.96) scaleY(1.06);
    }
    .score .comma {
      position: relative;
      grid-column: 1;
      grid-row: 1;
      place-self: center end;
      width: auto;
      height: auto;
      padding: 0;
      font-size: .68em;
      line-height: .8;
      transform: translate(38%, 28%);
    }
    @supports (font-size: 1cqh) {
      .score:not(.rank-score) .digit:not(.comma) {
        font-size: 78cqh;
        transform: translateY(-3%) scaleX(.96) scaleY(1.06);
      }
      .score:not(.rank-score) .comma { font-size: 53cqh; }
      .rank-score .digit:not(.comma) {
        font-size: 86cqh;
        transform: translateY(-5%) scaleX(.96) scaleY(1.06);
      }
      .rank-score .comma { font-size: 55cqh; }
    }
    @supports (text-box-trim: trim-both) {
      .score .digit:not(.comma) {
        text-box-trim: trim-both;
        text-box-edge: cap alphabetic;
      }
      .score:not(.rank-score) .digit:not(.comma) {
        transform: scaleX(.96) scaleY(1.06);
      }
      .rank-score .digit:not(.comma) {
        transform: scaleX(.96) scaleY(1.06);
      }
    }
    
    .ride-one-p1 { left: 5.73%; top: 39%; width: 23.63%; height: 14.8%; }
    .ride-one-p2 { left: 5.73%; top: 72.2%; width: 23.63%; height: 14.8%; }
    .ride-two-p1 { left: 70.57%; top: 39%; width: 23.63%; height: 14.8%; color: #e40707; }
    .ride-two-p2 { left: 70.57%; top: 72.2%; width: 23.63%; height: 14.8%; color: #e40707; }
      /* 123456の1・2・3を左へ */
.ride-one-p1 .digit:nth-child(1),
.ride-one-p1 .digit:nth-child(2),
.ride-one-p1 .digit:nth-child(3) {
    position: relative;
    right: 1mm;
}
    
    .ride-one-p1 .digit:not(.comma) {
    translate: 0 -0mm;
    scale: 0.96;
}

      /* 7600だけ調整 */
.ride-one-p2 .digit:not(.comma) {
    translate: -0mm -1mm;
}


      /* 8410全体：少し上＋少し小さく */
.ride-two-p2 .digit:not(.comma) {
    translate: 0 -1mm;
    scale: 0.94;
}
      
    .rank-score {
    grid-template-columns: repeat(5, 1fr);
    font-size: clamp(30px, 8.4vmin, 133px);
}
    
    .ride-one-p1 .comma,
    .ride-one-p2 .comma {
      translate: 6px 0;
      transform: translate(52%, 20%);
    }
    .rank-one .digit:not(.comma) { transform: translateY(-8%) scaleX(.96) scaleY(1.06); }
    .rank-one .comma { translate: 0 -2px; transform: translate(38%, 20%); }
    .rank-three .digit:not(.comma) { transform: translateY(-6%) scaleX(.96) scaleY(1.06); }
    .rank-three .comma { transform: translate(38%, 16%); }
    @supports (font-size: 1cqh) {
      .rank-three .digit:not(.comma) { font-size: 100cqh; }
    }
    .rank-one { left: 37.63%; top: 34.5%; width: 24.87%; height: 12.4%; color: #e40707; font-size: clamp(34px, 8.6vmin, 136px); }
    .rank-two { left: 37.83%; top: 56.7%; width: 24.35%; height: 10.2%; color: #003ee8; }
    .rank-three { left: 37.83%; top: 78.3%; width: 24.35%; height: 8.3%; translate: 0 -5px; transform: translateY(3px); color: #087918; }
  /* 数字の位置だけ微調整 */



/* 3位の10900を少し下へ */
.rank-three .digit:not(.comma) {
    translate: 0 5px;
}
      .digit.comma-after {
  position: relative;
}

.digit.comma-after::after {
  content: ",";
  position: absolute;
  right: -0.38em;
  top: 36%;
  font-size: .55em;
  transform: translateY(-5%);
}
      /* カンマ個別調整 */
.ride-one-p1 .comma-after::after {
  right: -0.30em;
  top: 57%;
}

.ride-one-p2 .comma-after::after {
  right: -0.18em;
    top: 50%;
}

.ride-two-p1 .comma-after::after {
  right: -0.20em;
    top: 55%;
}

.ride-two-p2 .comma-after::after {
  right: -0.17em;
    top: 50%;
}

.rank-one .comma-after::after {
  right: -0.25em;
    top: 60%;
}

.rank-two .comma-after::after {
  right: -0.40em;
    top: 65%;
}

.rank-three .comma-after::after {
  right: -0.23em;
    top: 50%;
}
  </style>
</head>
<body>
  <main class="viewer" aria-label="High Score Viewer">
    <div class="score ride-one-p1" data-score="123,456" aria-label="RIDE 1 Player 1 123,456 points"></div>
    <div class="score ride-one-p2" data-score="7,600" aria-label="RIDE 1 Player 2 7,600 points"></div>
    <div class="score ride-two-p1" data-score="7,950" aria-label="RIDE 2 Player 1 7,950 points"></div>
    <div class="score ride-two-p2" data-score="8,410" aria-label="RIDE 2 Player 2 8,410 points"></div>
    <div class="score rank-score rank-one" data-score="12,500" aria-label="1位 12,500 points"></div>
    <div class="score rank-score rank-two" data-score="11,800" aria-label="2位 11,800 points"></div>
    <div class="score rank-score rank-three" data-score="10,900" aria-label="3位 10,900 points"></div>
  </main>
  <script>
document.querySelectorAll('[data-score]').forEach((score) => {
  const value = score.dataset.score.replace(/,/g, '');
  const padded = value.padStart(6, ' ');

  padded.split('').forEach((character, index) => {
    const digit = document.createElement('span');
    digit.className = 'digit';
    digit.textContent = character;
    score.appendChild(digit);

    if (index === 2 && value.length >= 4) {
    digit.classList.add('comma-after');
}
  });
});
</script>
</body>
</html>
